<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>쿠팡 골드박스 후보 수집기</title>
  <style>
    body { width: 320px; margin: 0; font-family: Arial, "Noto Sans KR", sans-serif; color: #1f2937; }
    main { padding: 18px; }
    h1 { margin: 0 0 10px; font-size: 17px; }
    p { margin: 0 0 12px; font-size: 13px; line-height: 1.55; color: #4b5563; }
    button { width: 100%; border: 0; border-radius: 6px; padding: 11px 12px; color: #fff; background: #e94536; font-weight: 700; cursor: pointer; }
    button:disabled { background: #9ca3af; cursor: wait; }
    #status { min-height: 34px; margin-top: 12px; font-size: 12px; line-height: 1.45; }
    .notice { padding: 10px; background: #f3f4f6; border-radius: 6px; }
  </style>
</head>
<body>
  <main>
    <h1>쿠팡 골드박스 후보 수집기</h1>
    <p class="notice">현재 열린 쿠팡 파트너스 골드박스 화면에서 상품명·표시 가격·상품 URL·대표 이미지 URL만 수집해 JSON 파일로 저장합니다. 로그인 정보·쿠키·비밀번호는 읽지 않습니다.</p>
    <button id="collect">현재 골드박스 후보 저장</button>
    <button id="inspect" style="margin-top: 9px; background: #374151;">첫 후보 상품정보 확인</button>
    <button id="generate" style="margin-top: 9px; background: #0f766e;">첫 후보 파트너스 링크 생성·저장</button>
    <button id="batch" style="margin-top: 9px; background: #7c3aed;">정제 후보 링크 일괄 생성·저장</button>
    <button id="detail" style="margin-top: 9px; background: #a16207;">현재 상품 상세 검증·저장</button>
    <p id="status" aria-live="polite"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
