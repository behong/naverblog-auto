<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>관리자 최초 설정 · 토스 수집 관리</title>
  <link rel="stylesheet" href="/internal-toss.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <p class="eyebrow">ADMIN · FIRST-TIME SETUP</p>
      <h1>관리자 비밀번호 설정</h1>
      <p class="intro">기존 내부 접근 토큰으로 한 번만 본인 확인한 뒤 새 관리자 비밀번호를 만듭니다. 비밀번호 원문은 저장되지 않고, PBKDF2 해시만 데이터베이스에 보관됩니다.</p>
    </header>

    <section class="card access-card" aria-labelledby="setup-title">
      <div>
        <p class="section-kicker">SECURE SETUP</p>
        <h2 id="setup-title">최초 관리자 설정</h2>
        <p class="muted">기존 접근 토큰은 이 브라우저 탭 세션에만 보관되고, 설정이 끝나면 즉시 지워집니다.</p>
      </div>
      <form id="setupForm" class="access-form">
        <label for="accessToken">기존 내부 접근 토큰</label>
        <input id="accessToken" name="accessToken" type="password" autocomplete="off" spellcheck="false" required placeholder="기존 AUTOMATION_API_TOKEN 입력">
        <label for="newPassword">새 관리자 비밀번호</label>
        <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required minlength="12" placeholder="12자 이상 새 비밀번호 입력">
        <label for="confirmation">새 관리자 비밀번호 확인</label>
        <div class="token-row">
          <input id="confirmation" name="confirmation" type="password" autocomplete="new-password" required minlength="12" placeholder="같은 비밀번호를 다시 입력">
          <button type="submit" class="primary">관리자 비밀번호 설정</button>
        </div>
        <p id="setupStatus" class="status" role="status">설정 후에는 `/admin/`에서 비밀번호로 로그인합니다.</p>
      </form>
    </section>
  </main>
  <script src="/admin-setup.js"></script>
</body>
</html>
